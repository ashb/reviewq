# reviewq configuration.
#
# A PR is *tracked* if it matches any interest rule in its project, or if GitHub
# says I am already involved. Every queue item carries a reason string naming
# the rule that produced it; `reviewq show N` prints it.
#
# Nothing here is how you stop watching one: `reviewq untrack N` is, and it
# outranks the rules below — a PR you have untracked stays untracked however
# well it matches, until `reviewq track N` puts it back.

[identity]
# Whose queue this is. All attention reasons are computed relative to this login.
login = "ashb"

# A project bundles one or more repos with the interest rules that apply to
# them. Add more [[project]] blocks for other codebases; each carries its own
# rules, since conventions differ per project. With more than one repo configured,
# a bare PR number is resolved against the ledger; a full pull-request URL names
# its repo outright and always works.
[[project]]
name  = "airflow"
repos = [{ owner = "apache", name = "airflow" }]
# A repo on a self-hosted instance names its host, which selects a [forge] entry
# below; the default is "github.com":
#   repos = [{ owner = "acme", name = "widgets", host = "github.acme.example" }]
# A repo may also name a local checkout. reviewq never reads the working tree —
# the queue comes from the forge — but `review` runs the handoff command there,
# which is what lets a review tool publish back to the pull request. Without it,
# `wiff forge pull {url}` mirrors the PR fine and then refuses to publish:
# "publishing a forge review pulled outside its repository is not supported".
#   repos = [{ owner = "apache", name = "airflow", path = "~/code/airflow" }]
# Labels worth showing on a queue row, in the colours the repo paints them —
# per repo, since the same name is a different colour in another project. A row
# has space for two or three beside the title, so name the families you steer by
# rather than everything: a pattern is a whole label name unless it carries a
# `*`, which matches any run of characters (`area:*` takes the family). The detail
# pane shows every label a PR carries regardless. Colours come from
# `reviewq sync --labels`, which an ordinary sync does not ask for: they change
# about never, and a label with no colour yet is drawn as plain text.
#   show_labels = ["area:*", "backport"]

# Keep surfacing every one of this project's PRs after it merges, so a post-merge
# reply or mention can flag something that shipped broken. Off by default — the
# queue normally ends at merge. Turn it on per project if you review post-merge:
#   include_merged = true
# For one rule's PRs rather than all of them, see `after_merge` on a rule below.

# Interest rules. Every rule *adds* to the queue; none of them takes anything
# away. A PR is interesting if ANY rule matches, so the rules below are read
# together rather than in sequence, and a PR matching none of them is simply
# not tracked by interest — it is not "excluded", and another rule naming it
# still brings it in.
#
# Within a rule, any listed value of a dimension matches — and a rule setting
# several dimensions requires all of them, so one rule reads as an AND of ORs:
#   [[project.interest]]
#   name                = "first-timer in the task sdk"
#   author_associations = ["FIRST_TIME_CONTRIBUTOR"]
#   paths               = ["task-sdk/**"]

# Labels. apache/airflow's boring-cyborg.yml maps paths -> area/provider labels
# upstream, so labels do most of the work and stay maintained for free.
[[project.interest]]
labels = ["area:task-sdk", "area:serialization", "area:Executors-core", "area:Scheduler"]

# Path globs matched against changed-file paths, for what labels miss.
[[project.interest]]
paths = ["task-sdk/**", "airflow-core/src/airflow/serialization/**"]

# Author classes that raise interest even off-label.
# GitHub values: FIRST_TIME_CONTRIBUTOR, FIRST_TIMER, NONE, CONTRIBUTOR,
# COLLABORATOR, MEMBER, OWNER.
[[project.interest]]
author_associations = ["FIRST_TIME_CONTRIBUTOR"]

# Named people, for what a relationship class cannot say — whose PRs these are.
# Logins, matched however GitHub happens to capitalise them:
#   [[project.interest]]
#   authors = ["potiuk"]

# A rule may also keep its own PRs on the queue after they merge, without the
# whole project doing so — a change in these paths, by someone whose work you
# check, is worth a look even once it has shipped:
#   [[project.interest]]
#   authors     = ["a-new-name"]
#   paths       = ["airflow-core/src/airflow/serialization/**"]
#   after_merge = true

# Milestones I'm watching (substring match against the milestone title). This
# adds the 3.2 PRs; it does not hide PRs in any other milestone, which the rules
# above and below go on matching as they did.
[[project.interest]]
milestones = ["3.2"]

# A rule may carry an optional `name`, which becomes its reason string:
#   [[project.interest]]
#   name = "task-sdk"
#   labels = ["area:task-sdk"]

[involvement]
# Relationships to you that make a PR "involved" and surface it, even off your
# interest rules. Each is found with a GitHub search — the same mechanism as
# interest, no notifications firehose:
#   review_requested -> review-requested:you    assign  -> assignee:you
#   mention          -> mentions:you            author  -> author:you
#                                               comment -> commenter:you
#
# `author` and `comment` are left out of the default on purpose — the attention
# state machine handles replies on your threads and reviews of your PRs more
# precisely — but you can add them. A [[project]] may set its own `involvement`
# list to override this per project (e.g. only ["mention"] for a repo you lurk).
reasons = ["review_requested", "mention", "assign"]

[bots]
# Comments by these accounts never trigger an attention reason.
logins = ["boring-cyborg[bot]", "github-actions[bot]", "codecov[bot]"]

[handoff]
# `reviewq review N` execs this; "{number}" and "{url}" (the PR's full web
# URL) are substituted in every element. Prefer "{url}" where the tool
# supports it — a bare number only works run from inside a checkout of the
# right repo, since that's the only way to infer which one.
#
# The default opens the PR in a browser, which needs nothing installed and no
# checkout. Point it at a review tool to review in the terminal instead:
#   review_command = ["wiff", "forge", "pull", "{url}"]
review_command = ["open", "{url}"]

[sync]
# How far back the first-ever sync reaches.
bootstrap_days = 14
# Overlap subtracted from the stored cursor, absorbing search-index lag.
overlap_minutes = 5
# GraphQL page size for the cheap sweep.
page_size = 50

[output]
# Underline a hyperlinked PR title in `show`'s human output. Some terminals
# (Ghostty, for one) give no hover indication a terminal hyperlink exists at
# all unless a modifier is already held, so without this the link is
# invisible until you know to try it.
underline_links = true
# Which background the tui's palette is adapted for: "dark" or "light". Asking
# the terminal takes an OSC 11 query it may ignore, and guessing wrong makes
# every colour wrong, so this is configured.
theme = "dark"

# The glyphs a queue row is marked with, saying where you stand with the PR.
# `deferred` defaults to a Nerd Font codepoint (U+F04B2), which a terminal
# without a patched font draws as a box — override it with anything yours can
# draw. Shown dimmed when what you did no longer covers the PR's current head.
#   [output.marks]
#   reviewed = "✓"   # you submitted a review on the forge
#   done     = "·"   # you marked it done here
#   deferred = "z"   # you deferred it to the bottom

# The glyphs that stand in for a word beside a fact about the PR. `branch`
# defaults to a Nerd Font codepoint (U+F419, git-branch), which a terminal
# without a patched font draws as a box — override it with anything yours can
# draw, or with "" to show the branch name on its own.
#   [output.icons]
#   branch = "->"

# How a saved screen is drawn. An SVG names fonts, it cannot carry them, so what
# a viewer sees depends on what it can resolve: the text face comes from Bunny (a
# Google Fonts mirror that sets no cookies), and the symbol face is only named —
# a font already installed needs no fetching, and no privacy-preserving CDN
# carries one. Set font_css = [] for a file that fetches nothing at all.
#   [output.svg]
#   font_css    = ["https://fonts.bunny.net/css?family=jetbrains-mono:400,700"]
#   font_family = '"JetBrains Mono", "Symbols Nerd Font", monospace'

# Per-host forge settings, keyed by host. Public github.com is built in, so this
# whole section is optional. A user entry overlays the built-in field by field.
#
# Token resolution for a host, in order: $REVIEWQ_GITHUB_TOKEN, then the host's
# token_file_env, then its token_env, then (github only) $GH_TOKEN, then the
# host's token_command, then (github only) `gh auth token`. Env sources come
# first, so an unattended cron/systemd run that sets a token variable never
# blocks on an interactive unlock prompt.
#
# token_command runs a program (argv, no shell) and reads the token from its
# stdout — handy for a secret manager. For example, pull it from 1Password:
#   [forge."github.com"]
#   token_command = ["op", "read", "op://Private/GitHub/token"]
# or reuse a configured 1Password gh plugin:
#   token_command = ["op", "plugin", "run", "--", "gh", "auth", "token"]
#
# For a GitHub Enterprise host:
#   [forge."github.acme.example"]
#   provider = "github"
#   api_base = "https://github.acme.example/api/v3"
#   token_env = "ACME_GH_TOKEN"
#   token_file_env = "ACME_GH_TOKEN_FILE"
