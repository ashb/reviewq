[workspace]
members = ["crates/reviewq", "crates/reviewq-core", "crates/reviewq-forge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
reviewq-core = { path = "crates/reviewq-core" }
reviewq-forge = { path = "crates/reviewq-forge" }

anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
etcetera = "0.11.0"
globset = "0.4.20"
insta = "1.48.0"
jiff = { version = "0.2.35", features = ["serde"] }
octocrab = "0.54.1"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
