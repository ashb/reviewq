[workspace]
members = [
    "crates/reviewq",
    "crates/reviewq-app",
    "crates/reviewq-core",
    "crates/reviewq-forge",
    "crates/reviewq-ledger",
    "crates/reviewq-tui",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
reviewq-app = { path = "crates/reviewq-app" }
reviewq-core = { path = "crates/reviewq-core" }
reviewq-forge = { path = "crates/reviewq-forge" }
reviewq-ledger = { path = "crates/reviewq-ledger" }
reviewq-tui = { path = "crates/reviewq-tui" }

anyhow = "1.0.104"
# `osc52` is the clipboard escape sequence, which the tui uses to copy a PR URL
# through the terminal it already owns rather than via a display-server library.
crossterm = { version = "0.29", features = ["osc52"] }
async-trait = "0.1"
clap = { version = "4.6.5", features = ["derive"] }
etcetera = "0.11.0"
globset = "0.4.20"
insta = "1.48.0"
jiff = { version = "0.2.35", features = ["serde"] }
octocrab = "0.54.1"
portable-pty = "0.9"
# `unstable-rendered-line-info` is `Paragraph::line_count`, which is how the
# detail pane learns how many lines its wrapped content actually came to — the
# unit `Paragraph::scroll` moves in. Counting `Line`s instead would under-count
# a wrapped description and stop scrolling short of the end. Explicitly
# unstable, but a rename would be a compile error rather than a silent bug.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
# default-features off drops syntect + ansi-to-tui, which only serve fenced-code
# highlighting — a lot of dependency for a description panel that's mostly prose
# and checklists. One line to turn on if code blocks start mattering.
tui-markdown = { version = "0.3.9", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
